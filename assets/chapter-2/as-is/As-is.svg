<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="100%" height="100%" style="background:#f8f9fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="18" fill="#5f6368" font-weight="600">Segmento 1:</text>

  <!-- Grid Borders -->
  <g stroke="#e0e0e0" stroke-width="1.5">
    <!-- Horizontal separators -->
    <line x1="40" y1="70" x2="1120" y2="70"/>
    <line x1="40" y1="160" x2="1120" y2="160"/>
    <line x1="40" y1="360" x2="1120" y2="360"/>
    <line x1="40" y1="550" x2="1120" y2="550"/>
    <line x1="40" y1="730" x2="1120" y2="730"/>

    <!-- Vertical separators -->
    <line x1="40" y1="70" x2="40" y2="730"/>
    <line x1="160" y1="70" x2="160" y2="730"/>
    <line x1="400" y1="70" x2="400" y2="730"/>
    <line x1="640" y1="70" x2="640" y2="730"/>
    <line x1="880" y1="70" x2="880" y2="730"/>
    <line x1="1120" y1="70" x2="1120" y2="730"/>
  </g>

  <!-- Row Headers -->
  <text x="100" y="122" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">Steps</text>
  <text x="100" y="265" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">Doing</text>
  <text x="100" y="460" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">Thinking</text>
  <text x="100" y="645" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">Feeling</text>

  <!-- Column Headers -->
  <text x="280" y="122" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Shift Start &amp; Planning</text>
  <text x="520" y="122" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Peak Check-in/out</text>
  <text x="760" y="112" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Room Status</text>
  <text x="760" y="136" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Tracking</text>
  <text x="1000" y="122" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Closing &amp; Reporting</text>

  <!-- Row 1: Doing (Yellow Sticky Notes) -->
  <!-- Col 1 -->
  <rect x="205" y="190" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="280" y="225" font-size="13" fill="#212121" text-anchor="middle">Checks</text>
  <text x="280" y="245" font-size="13" fill="#212121" text-anchor="middle">WhatsApp/Emails</text>
  <text x="280" y="265" font-size="13" fill="#212121" text-anchor="middle">and manually</text>
  <text x="280" y="285" font-size="13" fill="#212121" text-anchor="middle">updates the Excel</text>
  <text x="280" y="305" font-size="13" fill="#212121" text-anchor="middle">sheet or notebook.</text>

  <!-- Col 2 -->
  <rect x="445" y="190" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="520" y="225" font-size="13" fill="#212121" text-anchor="middle">Handles</text>
  <text x="520" y="245" font-size="13" fill="#212121" text-anchor="middle">payments and</text>
  <text x="520" y="265" font-size="13" fill="#212121" text-anchor="middle">registration</text>
  <text x="520" y="285" font-size="13" fill="#212121" text-anchor="middle">forms by hand</text>
  <text x="520" y="305" font-size="13" fill="#212121" text-anchor="middle">while answering</text>
  <text x="520" y="325" font-size="13" fill="#212121" text-anchor="middle">the phone.</text>

  <!-- Col 3 -->
  <rect x="685" y="190" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="760" y="230" font-size="13" fill="#212121" text-anchor="middle">Walks to the</text>
  <text x="760" y="250" font-size="13" fill="#212121" text-anchor="middle">rooms or uses a</text>
  <text x="760" y="270" font-size="13" fill="#212121" text-anchor="middle">radio to ask</text>
  <text x="760" y="290" font-size="13" fill="#212121" text-anchor="middle">housekeeping if</text>
  <text x="760" y="310" font-size="13" fill="#212121" text-anchor="middle">rooms are ready.</text>

  <!-- Col 4 -->
  <rect x="925" y="190" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="1000" y="225" font-size="13" fill="#212121" text-anchor="middle">Tries to reconcile</text>
  <text x="1000" y="245" font-size="13" fill="#212121" text-anchor="middle">payments and</text>
  <text x="1000" y="265" font-size="13" fill="#212121" text-anchor="middle">manually updates</text>
  <text x="1000" y="285" font-size="13" fill="#212121" text-anchor="middle">availability for the</text>
  <text x="1000" y="305" font-size="13" fill="#212121" text-anchor="middle">next day</text>

  <!-- Row 2: Thinking (Yellow Sticky Notes) -->
  <!-- Col 1 -->
  <rect x="205" y="385" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="280" y="430" font-size="13" fill="#212121" text-anchor="middle">"Did I miss</text>
  <text x="280" y="450" font-size="13" fill="#212121" text-anchor="middle">any late-night</text>
  <text x="280" y="470" font-size="13" fill="#212121" text-anchor="middle">bookings?" "Is</text>
  <text x="280" y="490" font-size="13" fill="#212121" text-anchor="middle">the Excel file</text>
  <text x="280" y="510" font-size="13" fill="#212121" text-anchor="middle">current?"</text>

  <!-- Col 2 -->
  <rect x="445" y="385" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="520" y="430" font-size="13" fill="#212121" text-anchor="middle">"I hope the credit</text>
  <text x="520" y="450" font-size="13" fill="#212121" text-anchor="middle">card machine</text>
  <text x="520" y="470" font-size="13" fill="#212121" text-anchor="middle">works." "Why is</text>
  <text x="520" y="490" font-size="13" fill="#212121" text-anchor="middle">everyone arriving</text>
  <text x="520" y="510" font-size="13" fill="#212121" text-anchor="middle">at once?"</text>

  <!-- Col 3 -->
  <rect x="685" y="385" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="760" y="430" font-size="13" fill="#212121" text-anchor="middle">"Why isn't the</text>
  <text x="760" y="450" font-size="13" fill="#212121" text-anchor="middle">staff answering</text>
  <text x="760" y="470" font-size="13" fill="#212121" text-anchor="middle">the radio?" "Is</text>
  <text x="760" y="490" font-size="13" fill="#212121" text-anchor="middle">room 302 clean</text>
  <text x="760" y="510" font-size="13" fill="#212121" text-anchor="middle">yet?"</text>

  <!-- Col 4 -->
  <rect x="925" y="385" width="150" height="140" fill="#fff59d" filter="url(#shadow)" rx="2"/>
  <text x="1000" y="430" font-size="13" fill="#212121" text-anchor="middle">"I hope there</text>
  <text x="1000" y="450" font-size="13" fill="#212121" text-anchor="middle">are no double</text>
  <text x="1000" y="470" font-size="13" fill="#212121" text-anchor="middle">bookings for</text>
  <text x="1000" y="490" font-size="13" fill="#212121" text-anchor="middle">tomorrow." "I'm</text>
  <text x="1000" y="510" font-size="13" fill="#212121" text-anchor="middle">exhausted."</text>

  <!-- Row 3: Feeling (Pink Sticky Notes) -->
  <!-- Col 1 -->
  <rect x="205" y="575" width="150" height="130" fill="#ff8a80" filter="url(#shadow)" rx="2"/>
  <text x="280" y="630" font-size="14" fill="#212121" text-anchor="middle">Anxious</text>
  <text x="280" y="652" font-size="14" fill="#212121" text-anchor="middle">about</text>
  <text x="280" y="674" font-size="14" fill="#212121" text-anchor="middle">missing data.</text>

  <!-- Col 2 -->
  <rect x="445" y="575" width="150" height="130" fill="#ff8a80" filter="url(#shadow)" rx="2"/>
  <text x="520" y="620" font-size="14" fill="#212121" text-anchor="middle">Overwhelme</text>
  <text x="520" y="642" font-size="14" fill="#212121" text-anchor="middle">d and</text>
  <text x="520" y="664" font-size="14" fill="#212121" text-anchor="middle">stressed by</text>
  <text x="520" y="686" font-size="14" fill="#212121" text-anchor="middle">the crowd.</text>

  <!-- Col 3 -->
  <rect x="685" y="575" width="150" height="130" fill="#ff8a80" filter="url(#shadow)" rx="2"/>
  <text x="760" y="620" font-size="14" fill="#212121" text-anchor="middle">Frustrated by</text>
  <text x="760" y="642" font-size="14" fill="#212121" text-anchor="middle">slow internal</text>
  <text x="760" y="664" font-size="14" fill="#212121" text-anchor="middle">communicati</text>
  <text x="760" y="686" font-size="14" fill="#212121" text-anchor="middle">on.</text>

  <!-- Col 4 -->
  <rect x="925" y="575" width="150" height="130" fill="#ff8a80" filter="url(#shadow)" rx="2"/>
  <text x="1000" y="630" font-size="14" fill="#212121" text-anchor="middle">Tired and</text>
  <text x="1000" y="652" font-size="14" fill="#212121" text-anchor="middle">worried about</text>
  <text x="1000" y="674" font-size="14" fill="#212121" text-anchor="middle">human errors.</text>
</svg>
