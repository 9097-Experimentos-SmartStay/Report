name: Report

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Probar el generador
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Comprobar el informe para la entrega
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: python3 scripts/build_report.py --check
      - name: Generar y validar el informe
        run: python3 scripts/build_report.py

  sync-readme:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Actualizar README desde los capítulos
        env:
          REPORT_BRANCH: develop
        run: |
          python3 scripts/build_report.py
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: regenerate report README'
          git push origin "HEAD:$REPORT_BRANCH"
